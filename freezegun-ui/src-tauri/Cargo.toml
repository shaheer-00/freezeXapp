[package]
name = "freezegun-ui"
version = "0.2.0"
description = "freezeXapp — freeze time + block network for any app"
authors = ["you"]
edition = "2021"

[lib]
name = "freezegun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
freeze-core = { path = "../../freeze-core", features = ["host"] }
windows = { version = "0.62", features = [
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
